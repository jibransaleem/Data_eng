# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: DataEng
prefect-version: 3.9.4

# build section allows you to manage and build docker images
build:

# push section allows you to manage if and how this project
# is uploaded to remote locations
push:

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/jibransaleem/Data_eng.git
    branch: main

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: default
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: deployments.py:dag
  parameters: {}
  work_pool:
    name: worker
    work_queue_name:
    job_variables: {}
  schedules:
- name: etl-deploy
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: seq_and_async.py:ecommerce_etl
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules:
- name: parameter-deployment
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: parameterized_deployment.py:run_param_deploy
  parameters: {}
  work_pool:
    name: default
    work_queue_name:
    job_variables: {}
  schedules:
